<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth"><div class="card"><h1>Login</h1><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Login</button></form><p id="msg"></p><a href="register.html">Create account</a> · <a href="reset-password.html">Reset password</a></div></div><script src="config.js"></script><script>form.onsubmit=async e=>{e.preventDefault();let r=await fetch(API_BASE+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();msg.textContent=d.detail||d.message||'Login successful';if(r.ok){localStorage.setItem('token',d.access_token);localStorage.setItem('user',JSON.stringify(d.user));location.href='products.html'}};</script></body></html>
