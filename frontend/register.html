<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth"><div class="card"><h1>Create account</h1><form id="form"><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone"><input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><select id="role"><option value="consumer">Consumer</option><option value="farmer">Farmer</option></select><input id="address" placeholder="Address"><div class="grid2"><input id="lat" type="number" step="any" placeholder="Latitude"><input id="lng" type="number" step="any" placeholder="Longitude"></div><button class="btn">Register</button></form><p id="msg"></p><a href="login.html">Already registered?</a></div></div><script src="config.js"></script><script>form.onsubmit=async e=>{e.preventDefault();let r=await fetch(API_BASE+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value||null,password:password.value,role:role.value,address:address.value||null,latitude:lat.value?+lat.value:null,longitude:lng.value?+lng.value:null})});let d=await r.json();msg.textContent=d.detail||d.message}</script></body></html>
